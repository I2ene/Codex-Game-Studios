name: Codex design adapter

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.codex/agents/**'
      - 'codex/**'
      - '.github/workflows/codex-design.yml'
      - '.claude/**'
      - 'LICENSE'
      - 'project.yaml'
  push:
    paths:
      - '.agents/**'
      - '.codex/agents/**'
      - 'codex/**'
      - '.github/workflows/codex-design.yml'
      - '.claude/**'
      - 'LICENSE'
      - 'project.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python codex/validate_design.py
      - run: python -m unittest discover -s codex -p 'test_*.py'
