name: Framework validation
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
        env:
          # runner context is available at step scope, not jobs.<id>.env.
          TMPDIR: ${{ runner.temp }}
      - run: python tools/integration_sample.py
        env:
          TMPDIR: ${{ runner.temp }}
